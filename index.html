<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invariant Frog</title>
    <meta name="description" content="An interactive game for learning loop invariants." />
    <meta name="theme-color" content="#f6f8fb" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Invariant Frog" />
    <meta property="og:title" content="Invariant Frog" />
    <meta property="og:description" content="An interactive game for learning loop invariants." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Invariant Frog, in puffy 3D letters, over a plane of tiles where frogs hop around a ring" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- z3-solver's Emscripten build expects Node's `global` -->
    <script>globalThis.global = globalThis;</script>
    <style>
      html {
        height: 100%;
        background: linear-gradient(#f6f8fb, #e8ecf2 60%, #e3e8ef);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6fa;
        pointer-events: none;
        transition: opacity 0.45s ease-out;
      }
      html[data-started] #boot {
        opacity: 0;
      }
      #boot div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: boot-in 0.4s ease-out 1s both;
      }
      #boot span {
        display: flex;
        gap: 10px;
      }
      #boot p {
        margin: 0;
        font: 600 14px 'Nunito Variable', ui-rounded, system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: #66708a;
      }
      #boot i {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: #5c9df5;
        box-shadow:
          inset 0 -0.7px 0 #4687e6,
          0.9px 2.3px 0 #336ac1,
          1.2px 3.5px 3px rgb(40 50 70 / 0.32);
        animation: boot-hop 0.9s ease-in-out infinite;
      }
      #boot i:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-hop {
        0%,
        60%,
        100% {
          transform: none;
        }
        30% {
          transform: translateY(-8px);
          box-shadow:
            inset 0 -0.7px 0 #4687e6,
            0.9px 2.3px 0 #336ac1,
            1.2px 11.5px 4px rgb(40 50 70 / 0.12);
        }
      }
      #boot[data-failed] {
        pointer-events: auto;
      }
      #boot[data-failed] span {
        display: none;
      }
      #boot button {
        padding: 8px 18px;
        border: 0;
        border-radius: 999px;
        background: #3b82f6;
        box-shadow: 0 3px 0 #2563d4;
        color: #fff;
        font: 600 15px 'Nunito Variable', ui-rounded, system-ui, sans-serif;
        cursor: pointer;
      }
      #boot noscript p + p {
        margin-top: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status">
      <div>
        <span><i></i><i></i><i></i></span>
        <p>Loading…</p>
        <noscript>
          <style>
            #boot p:not(noscript p) { display: none; }
            #boot i { animation: none; }
          </style>
          <p>Invariant Frog needs JavaScript to run.</p>
          <p lang="ko">이 게임을 하려면 자바스크립트를 켜야 합니다.</p>
        </noscript>
      </div>
    </div>
    <script>
      (() => {
        let ko = false;
        try {
          ko = (localStorage.getItem('invariant-frog:lang') ?? (navigator.language.toLowerCase().startsWith('ko') ? 'ko' : 'en')) === 'ko';
        } catch {}
        const boot = document.getElementById('boot');
        const text = boot.querySelector('p');
        if (ko) {
          document.documentElement.lang = 'ko';
          text.textContent = '불러오는 중…';
          for (const href of %KOREAN_FONTS%) {
            const link = document.createElement('link');
            Object.assign(link, { rel: 'preload', as: 'font', type: 'font/woff2', crossOrigin: '', href });
            document.head.append(link);
          }
        }
        const failed = () => {
          if ('started' in document.documentElement.dataset || 'failed' in boot.dataset) return;
          boot.dataset.failed = '';
          boot.setAttribute('role', 'alert');
          text.textContent = ko ? '게임을 불러오지 못했습니다.' : 'The game didn’t load.';
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = ko ? '새로 고침' : 'Reload';
          button.addEventListener('click', () => location.reload());
          text.after(button);
        };
        addEventListener('error', (e) => (e.target instanceof HTMLScriptElement || e.target instanceof HTMLLinkElement) && failed(), true);
        setTimeout(failed, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
